name: Desktop build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET 8
        id: dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Select installed .NET 8 SDK
        env:
          DESKTOP_DOTNET_SDK: ${{ steps.dotnet.outputs.dotnet-version }}
        run: |
          @{ sdk = @{ version = $env:DESKTOP_DOTNET_SDK; rollForward = 'latestPatch' } } |
            ConvertTo-Json -Depth 3 |
            Set-Content -LiteralPath ./global.json -Encoding utf8NoBOM

      - name: Restore tests and application
        run: dotnet restore ./OpenWrtStudio.Tests/OpenWrtStudio.Tests.csproj

      # Live router and GitHub integration tests are opt-in; no credentials are supplied.
      - name: Run offline tests
        run: dotnet test ./OpenWrtStudio.Tests/OpenWrtStudio.Tests.csproj --configuration Release --no-restore --logger trx --results-directory ./TestResults

      - name: Publish portable application
        run: dotnet publish ./OpenWrtStudio.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output ./publish

      - name: Build Windows installer with the installed Inno Setup compiler
        run: ./scripts/build-installer.ps1 -OutputDirectory ./artifacts

      - name: Package portable archive and checksum
        run: |
          $project = [xml](Get-Content -LiteralPath ./OpenWrtStudio.csproj -Raw)
          $releaseVersion = [string]$project.Project.PropertyGroup.Version
          New-Item -ItemType Directory -Path ./artifacts -Force | Out-Null
          $archiveName = "OpenWrtStudio_v${releaseVersion}_Portable.zip"
          $archivePath = Join-Path ./artifacts $archiveName
          Compress-Archive -Path ./publish/* -DestinationPath $archivePath
          Get-ChildItem -LiteralPath ./artifacts -File |
            Where-Object { $_.Extension -in '.zip', '.exe' } |
            Sort-Object Name |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name } |
            Set-Content -LiteralPath ./artifacts/SHA256SUMS.txt -Encoding ascii

      - name: Upload Windows packages
        uses: actions/upload-artifact@v7
        with:
          name: OpenWrtStudio-win-x64
          path: |
            artifacts/*_Portable.zip
            artifacts/OpenWrtStudio_Setup_v*.exe
            artifacts/SHA256SUMS.txt
          compression-level: 0
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn

  portable-core:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - run: dotnet test OpenWrtStudio.Core.Tests/OpenWrtStudio.Core.Tests.csproj -c Release

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, portable-core]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: OpenWrtStudio-win-x64
          path: release
      - name: Verify complete versioned packages
        run: |
          python3 - <<'PYTHON'
          import os, re
          import xml.etree.ElementTree as ET
          from pathlib import Path
          version = ET.parse('OpenWrtStudio.csproj').findtext('./PropertyGroup/Version')
          assert os.environ['RELEASE_TAG'] == 'v' + version
          expected = [f'OpenWrtStudio_Setup_v{version}.exe', f'OpenWrtStudio_v{version}_Portable.zip', 'SHA256SUMS.txt']
          assert all((Path('release') / name).stat().st_size > 0 for name in expected)
          sums = Path('release/SHA256SUMS.txt')
          sums.write_text(sums.read_text())
          Path('release-notes.txt').write_text(Path('RELEASE_NOTES.md').read_text().split('\n---\n', 1)[0])
          PYTHON
          (cd release && sha256sum -c SHA256SUMS.txt)
      - name: Publish complete release
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite it.'
            exit 1
          fi
          gh release create "$RELEASE_TAG" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "OpenWrt Studio ${RELEASE_TAG#v}" --notes-file release-notes.txt --draft
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')" = 3
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
